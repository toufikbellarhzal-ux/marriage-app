    <title>تنظيم العلاقة الزوجية وفق الشريعة الإسلامية</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c5f2d 0%, #97bc62 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .bismillah {
            font-size: 1.5em;
            color: #2c5f2d;
            text-align: center;
            padding: 20px;
            font-weight: bold;
            border-bottom: 2px solid #97bc62;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #ddd;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #2c5f2d;
            color: white;
        }

        .btn-primary:hover {
            background: #1e3f1f;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #97bc62;
            color: white;
        }

        .btn-secondary:hover {
            background: #7da34e;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-install {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        .btn-install:hover {
            background: linear-gradient(135deg, #e55a2b 0%, #e0851a 100%);
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(255, 107, 53, 0);
            }
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 0.85em;
        }

        .share-menu {
            position: relative;
            display: inline-block;
        }

        .share-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            min-width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 10px;
            z-index: 100;
            margin-top: 5px;
            overflow: hidden;
        }

        .share-dropdown.active {
            display: block;
        }

        .share-dropdown a, .share-dropdown button {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            cursor: pointer;
            font-size: 1em;
        }

        .share-dropdown a:hover, .share-dropdown button:hover {
            background: #f1f1f1;
        }

        .sections {
            padding: 20px;
        }

        .section {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .section:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #97bc62;
        }

        .section-header {
            background: linear-gradient(135deg, #97bc62 0%, #2c5f2d 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: bold;
        }

        .section-icon {
            font-size: 1.5em;
            margin-left: 10px;
        }

        .section-body {
            padding: 20px;
        }

        .subsection {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-right: 4px solid #97bc62;
        }

        .subsection-title {
            color: #2c5f2d;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .subsection ul {
            list-style: none;
            padding-right: 20px;
        }

        .subsection ul li {
            padding: 5px 0;
            position: relative;
            padding-right: 20px;
        }

        .subsection ul li::before {
            content: "✓";
            color: #97bc62;
            position: absolute;
            right: 0;
            font-weight: bold;
        }

        .evidence {
            background: #fff3cd;
            border-right: 4px solid #ffc107;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 8px;
            font-style: italic;
        }

        .evidence-title {
            color: #856404;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .evidence-text {
            color: #555;
            line-height: 1.6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            color: #2c5f2d;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .close-modal {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .save-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 2000;
        }

        .install-guide {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .install-guide.active {
            display: flex;
        }

        .install-guide-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
        }

        .install-guide-content h2 {
            color: #2c5f2d;
            margin-bottom: 20px;
        }

        .install-steps {
            text-align: right;
            margin: 20px 0;
        }

        .install-steps li {
            padding: 10px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 8px;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .install-steps li .step-number {
            background: #2c5f2d;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c5f2d;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        @media print {
            body { background: white; padding: 0; }
            .controls, .section-actions, .add-subsection, .share-menu { display: none !important; }
            .section { page-break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.5em; }
            .controls { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="save-message" id="saveMessage">✓ تم بنجاح</div>

    <!-- زر التثبيت العائم -->
    <button class="btn btn-install" id="installBtn" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; box-shadow:0 5px 20px rgba(0,0,0,0.3); padding:15px 30px; font-size:1.1em;">
        📥 ثبّت التطبيق على هاتفك
    </button>

    <!-- دليل التثبيت -->
    <div class="install-guide" id="installGuide">
        <div class="install-guide-content">
            <h2 id="guideTitle">📥 تثبيت التطبيق</h2>
            <p id="guideSubtitle">اتبع الخطوات التالية لإضافة التطبيق إلى شاشتك الرئيسية:</p>
            <ol class="install-steps" id="installSteps"></ol>
            <button class="btn btn-primary" onclick="closeInstallGuide()">حسناً، فهمت</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🌿 تنظيم العلاقة الزوجية 🌿</h1>
            <p>وفق الشريعة الإسلامية الغراء</p>
        </div>

        <div class="bismillah">بسم الله الرحمن الرحيم</div>

        <div class="controls">
            <button class="btn btn-primary" onclick="saveData()">💾 حفظ المعلومات</button>
            <button class="btn btn-secondary" onclick="saveAsPDF()">📄 حفظ كـ PDF</button>
            <button class="btn btn-secondary" onclick="printContent()">🖨️ طباعة</button>
            <button class="btn btn-primary" onclick="addNewSection()">➕ إضافة قسم جديد</button>
            <button class="btn btn-install" onclick="showInstallGuide()">📥 تثبيت التطبيق</button>
            <div class="share-menu">
                <button class="btn btn-whatsapp" onclick="toggleShareMenu()">📤 مشاركة</button>
                <div class="share-dropdown" id="shareDropdown">
                    <button onclick="shareWhatsApp()">📱 واتساب</button>
                    <button onclick="shareTelegram()">✈️ تيليجرام</button>
                    <button onclick="shareTwitter()">🐦 تويتر</button>
                    <button onclick="shareFacebook()">📘 فيسبوك</button>
                    <button onclick="shareEmail()">📧 البريد الإلكتروني</button>
                    <button onclick="copyToClipboard()">📋 نسخ النص</button>
                </div>
            </div>
        </div>

        <div class="sections" id="sectionsContainer"></div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">إضافة عنصر جديد</h2>
            <div id="modalForm"></div>
            <button class="close-modal" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        // ============= PWA Installation Logic =============
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    showSaveMessage('تم تثبيت التطبيق بنجاح! 🎉');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            } else {
                showInstallGuide();
            }
        });

        window.addEventListener('appinstalled', () => {
            showSaveMessage('تم تثبيت التطبيق بنجاح! 🎉');
            installBtn.style.display = 'none';
        });

        // كشف نوع الجهاز والمتصفح
        function getDeviceInfo() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            const isAndroid = /android/i.test(userAgent);
            const isChrome = /chrome/i.test(userAgent);
            const isSafari = /safari/i.test(userAgent) && !/chrome/i.test(userAgent);
            const isSamsung = /samsung/i.test(userAgent);
            const isFirefox = /firefox/i.test(userAgent);
            
            return { isIOS, isAndroid, isChrome, isSafari, isSamsung, isFirefox };
        }

        function showInstallGuide() {
            const device = getDeviceInfo();
            const guideTitle = document.getElementById('guideTitle');
            const guideSubtitle = document.getElementById('guideSubtitle');
            const installSteps = document.getElementById('installSteps');
            
            installSteps.innerHTML = '';
            
            if (device.isIOS && device.isSafari) {
                guideTitle.textContent = '📱 تثبيت على iPhone/iPad';
                guideSubtitle.textContent = 'استخدم متصفح Safari واتبع الخطوات:';
                installSteps.innerHTML = `
                    <li><span class="step-number">1</span><span>اضغط على أيقونة <strong>المشاركة</strong> 📤 في أسفل الشاشة</span></li>
                    <li><span class="step-number">2</span><span>اختر <strong>"إضافة إلى الشاشة الرئيسية"</strong> ➕</span></li>
                    <li><span class="step-number">3</span><span>اضغط <strong>"إضافة"</strong> في أعلى اليمين</span></li>
                    <li><span class="step-number">4</span><span>ستجد التطبيق على شاشتك الرئيسية 🌿</span></li>
                `;
            } else if (device.isAndroid && device.isChrome) {
                guideTitle.textContent = '🤖 تثبيت على Android (Chrome)';
                guideSubtitle.textContent = 'سيظهر إشعار تلقائي أو اتبع الخطوات:';
                installSteps.innerHTML = `
                    <li><span class="step-number">1</span><span>اضغط على <strong>القائمة</strong> ⋮ في أعلى اليمين</span></li>
                    <li><span class="step-number">2</span><span>اختر <strong>"تثبيت التطبيق"</strong> أو "إضافة إلى الشاشة الرئيسية"</span></li>
                    <li><span class="step-number">3</span><span>اضغط <strong>"تثبيت"</strong> في الرسالة المنبثقة</span></li>
                    <li><span class="step-number">4</span><span>ستجد التطبيق في قائمة تطبيقاتك 🌿</span></li>
                `;
            } else if (device.isSamsung) {
                guideTitle.textContent = '📱 تثبيت على Samsung';
                guideSubtitle.textContent = 'متصفح Samsung Internet:';
                installSteps.innerHTML = `
                    <li><span class="step-number">1</span><span>اضغط على <strong>القائمة</strong> ☰ في الأسفل</span></li>
                    <li><span class="step-number">2</span><span>اختر <strong>"إضافة صفحة إلى"</strong></span></li>
                    <li><span class="step-number">3</span><span>اختر <strong>"الشاشة الرئيسية"</strong></span></li>
                    <li><span class="step-number">4</span><span>اضغط <strong>"إضافة"</strong> 🌿</span></li>
                `;
            } else if (device.isFirefox) {
                guideTitle.textContent = '🦊 تثبيت على Firefox';
                guideSubtitle.textContent = 'Firefox:';
                installSteps.innerHTML = `
                    <li><span class="step-number">1</span><span>اضغط على <strong>القائمة</strong> ⋮ في الأعلى</span></li>
                    <li><span class="step-number">2</span><span>اختر <strong>"تثبيت"</strong></span></li>
                    <li><span class="step-number">3</span><span>تأكيد التثبيت 🌿</span></li>
                `;
            } else {
                guideTitle.textContent = '📱 تثبيت التطبيق';
                guideSubtitle.textContent = 'الخطوات العامة للتثبيت:';
                installSteps.innerHTML = `
                    <li><span class="step-number">1</span><span>افتح إعدادات المتصفح</span></li>
                    <li><span class="step-number">2</span><span>ابحث عن خيار "إضافة إلى الشاشة الرئيسية" أو "تثبيت التطبيق"</span></li>
                    <li><span class="step-number">3</span><span>أكد عملية التثبيت</span></li>
                    <li><span class="step-number">4</span><span>ستجد التطبيق على شاشتك الرئيسية 🌿</span></li>
                `;
            }
            
            document.getElementById('installGuide').classList.add('active');
        }

        function closeInstallGuide() {
            document.getElementById('installGuide').classList.remove('active');
        }

        // ============= Data and App Logic =============
        const defaultData = {

        let appData = loadData();
        let currentEditSection = null;
        let currentEditSubsection = null;

        function loadData() {
            const saved = localStorage.getItem('marriageAppData');
            return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
        }

        function saveData() {
            localStorage.setItem('marriageAppData', JSON.stringify(appData));
            showSaveMessage('تم الحفظ بنجاح');
        }

        function showSaveMessage(text) {
            const msg = document.getElementById('saveMessage');
            msg.textContent = '✓ ' + text;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 2000);
        }

        function generateShareText() {
            let text = '🌿 *تنظيم العلاقة الزوجية وفق الشريعة الإسلامية* 🌿\n━━━━━━━━━━━━━━━━━━━━\n\n';
            appData.sections.forEach(section => {
                text += `${section.icon} *${section.title}*\n─────────────────\n`;
                section.subsections.forEach(sub => {
                    text += `\n📌 *${sub.title}:*\n`;
                    sub.items.forEach(item => { text += `  ✓ ${item}\n`; });
                    if (sub.evidence.text !== '—') {
                        text += `\n  📖 ${sub.evidence.title}:\n  ${sub.evidence.text}\n`;
                    }
                });
                text += '\n';
            });
            return text + '━━━━━━━━━━━━━━━━━━━━\n🤲 اللهم بارك لنا في أسرنا';
        }

        function shareWhatsApp() {
            window.open(`https://wa.me/?text=${encodeURIComponent(generateShareText())}`, '_blank');
            closeShareMenu();
        }
        function shareTelegram() {
            window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(generateShareText())}`, '_blank');
            closeShareMenu();
        }
        function shareTwitter() {
            const text = encodeURIComponent('🌿 تنظيم العلاقة الزوجية وفق الشريعة الإسلامية\n#أسرة_سعيدة #زواج_إسلامي');
            window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
            closeShareMenu();
        }
        function shareFacebook() {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
            closeShareMenu();
        }
        function shareEmail() {
            window.location.href = `mailto:?subject=${encodeURIComponent('تنظيم العلاقة الزوجية')}&body=${encodeURIComponent(generateShareText())}`;
            closeShareMenu();
        }
        function copyToClipboard() {
            const text = generateShareText();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showSaveMessage('تم نسخ النص'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showSaveMessage('تم نسخ النص');
            }
            closeShareMenu();
        }
        function toggleShareMenu() { document.getElementById('shareDropdown').classList.toggle('active'); }
        function closeShareMenu() { document.getElementById('shareDropdown').classList.remove('active'); }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.share-menu')) closeShareMenu();
        });

        function render() {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';
            appData.sections.forEach(section => {
                const div = document.createElement('div');
                div.className = 'section';
                div.innerHTML = `
                    <div class="section-header">
                        <div><span class="section-icon">${section.icon}</span><span class="section-title">${section.title}</span></div>
                        <div>
                            <button class="btn btn-small btn-secondary" onclick="editSection(${section.id})">✏️ تعديل</button>
                            <button class="btn btn-small btn-danger" onclick="deleteSection(${section.id})">🗑️ حذف</button>
                        </div>
                    </div>
                    <div class="section-body">
                        ${section.subsections.map(sub => `
                            <div class="subsection">
                                <div class="subsection-title">📌 ${sub.title}</div>
                                <ul>${sub.items.map(i => `<li>${i}</li>`).join('')}</ul>
                                <div class="evidence">
                                    <div class="evidence-title">📖 ${sub.evidence.title}</div>
                                    <div class="evidence-text">${sub.evidence.text}</div>
                                    <div style="margin-top:8px; display:flex; gap:5px; flex-wrap:wrap;">
                                        <button class="btn btn-small btn-secondary" onclick="editEvidence(${section.id}, '${sub.title}')">تعديل الدليل</button>
                                        <button class="btn btn-small btn-danger" onclick="deleteEvidence(${section.id}, '${sub.title}')">حذف</button>
                                        <button class="btn btn-small btn-secondary" onclick="editSubsection(${section.id}, '${sub.title}')">تعديل الفقرة</button>
                                        <button class="btn btn-small btn-danger" onclick="deleteSubsection(${section.id}, '${sub.title}')">حذف الفقرة</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                        <button class="btn btn-primary btn-small" onclick="addSubsection(${section.id})">➕ إضافة فقرة</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addNewSection() {
            currentEditSection = null;
            document.getElementById('modalTitle').textContent = 'إضافة قسم جديد';
            document.getElementById('modalForm').innerHTML = `
                <div class="form-group"><label>أيقونة</label><input type="text" id="sectionIcon" value="💑"></div>
                <div class="form-group"><label>اسم القسم</label><input type="text" id="sectionTitle"></div>
                <button class="btn btn-primary" onclick="saveNewSection()">حفظ</button>
            `;
            document.getElementById('addModal').classList.add('active');
        }

        function saveNewSection() {
            const title = document.getElementById('sectionTitle').value.trim();
            const icon = document.getElementById('sectionIcon').value.trim() || '💑';
            if (!title) return alert('أدخل اسم القسم');
            appData.sections.push({ id: Date.now(), title, icon, subsections: [] });
            closeModal(); render(); saveData();
        }

        function editSection(id) {
            const s = appData.sections.find(x => x.id === id);
            currentEditSection = id;
            document.getElementById('modalTitle').textContent = 'تعديل القسم';
            document.getElementById('modalForm').innerHTML = `
                <div class="form-group"><label>أيقونة</label><input type="text" id="sectionIcon" value="${s.icon}"></div>
                <div class="form-group"><label>اسم القسم</label><input type="text" id="sectionTitle" value="${s.title}"></div>
                <button class="btn btn-primary" onclick="saveEditSection()">حفظ</button>
            `;
            document.getElementById('addModal').classList.add('active');
        }

        function saveEditSection() {
            const s = appData.sections.find(x => x.id === currentEditSection);
            s.title = document.getElementById('sectionTitle').value.trim();
            s.icon = document.getElementById('sectionIcon').value.trim();
            closeModal(); render(); saveData();
        }

        function deleteSection(id) {
            if (confirm('حذف هذا القسم؟')) {
                appData.sections = appData.sections.filter(x => x.id !== id);
                render(); saveData();
            }
        }

        function addSubsection(id) {
            currentEditSection = id; currentEditSubsection = null;
            document.getElementById('modalTitle').textContent = 'إضافة فقرة';
            document.getElementById('modalForm').innerHTML = `
                <div class="form-group"><label>العنوان</label>
                    <select id="subTitle">
                        <option>الحقوق</option><option>الواجبات</option><option>النصائح</option>

                    </select>
                </div>

                <div class="form-group"><label>نص الدليل</label><textarea id="evidenceText"></textarea></div>
                <button class="btn btn-primary" onclick="saveNewSubsection()">حفظ</button>
            `;
            document.getElementById('addModal').classList.add('active');
        }

        function saveNewSubsection() {
            const section = appData.sections.find(x => x.id === currentEditSection);
            let title = document.getElementById('subTitle').value;
            if (title === 'custom') title = prompt('أدخل العنوان المخصص:');
            const items = document.getElementById('subItems').value.split('\n').filter(i => i.trim());
            section.subsections.push({
                title,
                items: items.length ? items : ['عنصر جديد'],
                evidence: {
                    title: document.getElementById('evidenceTitle').value || 'الدليل',
                    text: document.getElementById('evidenceText').value || '—'
                }
            });
            closeModal(); render(); saveData();
        }

        function editSubsection(id, title) {
            const section = appData.sections.find(x => x.id === id);
            const sub = section.subsections.find(s => s.title === title);
            currentEditSection = id; currentEditSubsection = title;
            document.getElementById('modalTitle').textContent = 'تعديل الفقرة';
            document.getElementById('modalForm').innerHTML = `
                <div class="form-group"><label>العنوان</label><input type="text" id="editSubTitle" value="${sub.title}"></div>
                <div class="form-group"><label>العناصر</label><textarea id="editSubItems">${sub.items.join('\n')}</textarea></div>
                <button class="btn btn-primary" onclick="saveEditSubsection()">حفظ</button>
            `;
            document.getElementById('addModal').classList.add('active');
        }

        function saveEditSubsection() {
            const section = appData.sections.find(x => x.id === currentEditSection);
            const sub = section.subsections.find(s => s.title === currentEditSubsection);
            sub.title = document.getElementById('editSubTitle').value.trim();
            sub.items = document.getElementById('editSubItems').value.split('\n').filter(i => i.trim());
            closeModal(); render(); saveData();
        }

        function deleteSubsection(id, title) {
            if (confirm('حذف هذه الفقرة؟')) {
                const section = appData.sections.find(x => x.id === id);
                section.subsections = section.subsections.filter(s => s.title !== title);
                render(); saveData();
            }
        }

        function editEvidence(id, title) {
            const section = appData.sections.find(x => x.id === id);
            const sub = section.subsections.find(s => s.title === title);
            currentEditSection = id; currentEditSubsection = title;
            document.getElementById('modalTitle').textContent = 'تعديل الدليل';
            document.getElementById('modalForm').innerHTML = `

                <div class="form-group"><label>نص الدليل</label><textarea id="evidenceText">${sub.evidence.text}</textarea></div>
                <button class="btn btn-primary" onclick="saveEditEvidence()">حفظ</button>
            `;
            document.getElementById('addModal').classList.add('active');
        }

        function saveEditEvidence() {
            const section = appData.sections.find(x => x.id === currentEditSection);
            const sub = section.subsections.find(s => s.title === currentEditSubsection);
            sub.evidence.title = document.getElementById('evidenceTitle').value.trim();
            sub.evidence.text = document.getElementById('evidenceText').value.trim();
            closeModal(); render(); saveData();
        }

        function deleteEvidence(id, title) {
            if (confirm('حذف الدليل؟')) {
                const section = appData.sections.find(x => x.id === id);
                const sub = section.subsections.find(s => s.title === title);
                sub.evidence = { title: 'لم يتم إضافة دليل', text: '—' };
                render(); saveData();
            }
        }

        function closeModal() { document.getElementById('addModal').classList.remove('active'); }

        function saveAsPDF() { alert('ستفتح نافذة الطباعة، اختر "حفظ كـ PDF"'); setTimeout(() => window.print(), 500); }
